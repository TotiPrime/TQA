<!doctype html><html lang="es"><meta charset="utf-8"><title>Prueba de rendimiento · IA con Criterio</title><h1>Prueba de rendimiento local</h1><p>Ejecuta la prueba una vez por dispositivo y conserva los resultados con el nombre del navegador, la memoria disponible y las condiciones de conexión. Los registros son sintéticos y se eliminan al finalizar.</p><button id="run">Medir ahora</button><pre id="report" aria-live="polite"></pre><script type="module">
import {replyTo} from './dist/knowledge.mjs';
const request=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);});
document.querySelector('#run').onclick=async function(){this.disabled=true;const out=document.querySelector('#report');out.textContent='';try{
 const qs=['Quiero usar menos IA','¿Cómo preparo la defensa?','¿Qué hago con un presupuesto?','¿Cómo reviso un afiche?','Quiero comprobar una fuente'];const t=[];
 for(let i=0;i<30;i++){let start=performance.now();replyTo(qs[i%qs.length]);t.push(performance.now()-start);}t.sort((a,b)=>a-b);
 out.textContent='Procesamiento local de 30 preguntas (sin dibujar la interfaz)\nMediana: '+((t[14]+t[15])/2).toFixed(3)+' ms · P95: '+t[28].toFixed(3)+' ms\nLos tiempos muy cortos dependen de la resolución del reloj.\n';
 for(const n of [10,100,1000]){const name='criterio-prueba-'+crypto.randomUUID(),r=indexedDB.open(name,1);r.onupgradeneeded=()=>r.result.createObjectStore('fichas',{keyPath:'id'});const db=await request(r);try{
 const start=performance.now(),tx=db.transaction('fichas','readwrite');const done=new Promise((ok,no)=>{tx.oncomplete=ok;tx.onabort=()=>no(tx.error);});for(let i=0;i<n;i++)tx.objectStore('fichas').put({id:i,etapa:'Diseño',decision:'Comparar dos opciones de prueba'});await done;const mid=performance.now();await request(db.transaction('fichas').objectStore('fichas').getAll());out.textContent+=n+' fichas · guardado '+(mid-start).toFixed(2)+' ms · lectura '+(performance.now()-mid).toFixed(2)+' ms\n';
 }finally{db.close();await request(indexedDB.deleteDatabase(name));}}}catch(e){out.textContent+='Error: '+e.message;}finally{this.disabled=false;}};
</script></html>
